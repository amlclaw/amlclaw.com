services:
  amlclaw-web:
    build: .
    container_name: amlclaw-web
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Optional: set keys here instead of the Settings UI (see .env.example)
      # - WIDTH_API_KEY=your_width_api_key
      # - ETHERSCAN_API_KEY=your_etherscan_api_key
      # - TRONGRID_API_KEY=your_trongrid_api_key
    restart: unless-stopped
